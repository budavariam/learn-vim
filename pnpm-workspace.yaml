# Only the ui-* apps are workspace packages. Git submodules
# (vimtutor, ui-arcade/vim-golf-challenges) stay outside on purpose.
packages:
  - 'ui-*'

# Install scripts are denied unless listed. @parcel/watcher is only an optional
# file watcher for `sass --watch`.
allowBuilds:
  '@parcel/watcher': false

# Single source of truth for versions shared between packages.
catalog:
  react: ^19.3.1
  react-dom: ^19.3.1
  react-router-dom: ^7.18.4
  lucide-react: ^1.61.0
  monaco-editor: ^0.57.0
  monaco-vim: ^0.4.4
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0

# Added by pnpm: these versions were younger than the minimum release age at install time.
minimumReleaseAgeExclude:
  - html-react-parser@6.1.9
  - lucide-react@1.61.0
  - sass@1.106.0
  - vite@8.3.5
