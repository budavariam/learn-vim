server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Docker's port mapping nginx doesn't know the public port (it only sees :80),
    # so absolute redirects would drop it (http://localhost/... instead of :3001).
    absolute_redirect off;

    # One bundle serves every app (/, /game/, /arcade/); unknown paths get the shell
    location /learn-vim/ {
        try_files $uri $uri/ /learn-vim/index.html;
    }

    # vimtutor: separate CRA app (homepage /vimtutor), built from the submodule
    location /vimtutor/ {
        try_files $uri $uri/ /vimtutor/index.html;
    }

    # Redirect bare root to the site
    location = / {
        return 301 /learn-vim/;
    }

    # Aggressive caching for hashed assets (JS, CSS, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # No cache for index.html so the app always fetches the latest shell
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
}
