# Root docker-compose for learn-vim
# vimtutor has its own compose at vimtutor/docker-compose.yml
#
# One pnpm workspace, one Vite app: cheatsheet (/), quiz (/game/), arcade (/arcade/).
#
# Profiles:
#   dev    — hot-reload Vite dev server  (default)
#   prod   — production nginx build
#
# Usage:
#   dev:  docker compose --profile dev up      → http://localhost:5173/learn-vim/
#   prod: docker compose --profile prod up --build → http://localhost:3001/learn-vim/

services:
  # ── dev ───────────────────────────────────────────────────────────────────
  # Mounts source for hot-reload; data.json is generated by the Vite plugin.
  learn-vim-dev:
    image: node:24-alpine
    profiles: [dev]
    working_dir: /app
    volumes:
      - .:/app
      # anonymous volumes keep node_modules inside the container
      - /app/node_modules
      - /app/ui-arcade/node_modules
      - /app/ui-cheatsheet/node_modules
      - /app/ui-practice/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm dev --host 0.0.0.0 --port 5173"

  # ── production ────────────────────────────────────────────────────────────
  # Multi-stage build: Vite build → nginx static server.
  learn-vim:
    profiles: [prod]
    build:
      context: .               # repo root — gives access to the workspace, scripts/ and vim-cheatsheet.md
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    restart: unless-stopped
