# Github Actions deploy workflow

name: Deployment
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Debug submodule
        run: |
          git submodule status
          ls -la ui-arcade
          ls -la ui-arcade/vim-golf-challenges
          test -f ui-arcade/vim-golf-challenges/README.org

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # One bundle for the whole site. dist/ already has the final layout:
      #   /          cheatsheet
      #   /game      quiz      (index.html shell copied by the build)
      #   /arcade    arcade    (index.html shell copied by the build)
      - name: Build
        run: pnpm build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./dist
          github_token: ${{ secrets.GITHUB_TOKEN }}
